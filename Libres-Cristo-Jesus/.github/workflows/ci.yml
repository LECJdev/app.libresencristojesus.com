name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # A real Postgres so the Prisma-backed integration tests actually RUN
    # here. Without it, `audit.service.spec.ts` skips itself (it is guarded
    # by `DATABASE_URL`) and CI would report green having never exercised a
    # single database write.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lcj
          POSTGRES_PASSWORD: lcj_ci_password
          POSTGRES_DB: lcj_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://lcj:lcj_ci_password@localhost:5432/lcj_connect_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Explicit rather than relying on Prisma's postinstall hook: the
      # generated client is a hard build input for apps/api, so a silent
      # generate failure must break here, not confusingly at `build`.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  commitlint:
    name: Validate commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PR commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
